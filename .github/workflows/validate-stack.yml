name: Validate stack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Compose using placeholder values
        run: docker compose --env-file .env.example config --quiet
      - name: Check the resolved recovery shell
        shell: bash
        run: |
          docker compose --env-file .env.example config --format json > "$RUNNER_TEMP/media-stack.json"
          python3 - "$RUNNER_TEMP/media-stack.json" <<'PY'
          import json
          import subprocess
          import sys

          with open(sys.argv[1]) as config_file:
              config = json.load(config_file)
          # Compose config serializes literal dollars escaped for reuse as Compose.
          script = config["services"]["qbittorrent-recovery"]["entrypoint"][2].replace("$$", "$")
          subprocess.run(["sh", "-n"], input=script, text=True, check=True)
          PY
