name: media-stack

# Bump this whenever Gluetun's Compose configuration/image changes. CI enforces
# it; the shared label makes Portainer recreate both namespace members.
x-vpn-stack-revision: &vpn-stack-revision "1"

x-common-env: &common-env
  TZ: ${TZ}
  PUID: ${PUID}
  PGID: ${PGID}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - media-net
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Primary torrent VPN. qBittorrent shares this network namespace, so it has
  # no independent network path that could bypass the VPN tunnel.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    networks:
      - media-net
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: ${GLUETUN_VPN_TYPE:-wireguard}
      OPENVPN_USER: ${NORDVPN_USER:-}
      OPENVPN_PASSWORD: ${NORDVPN_PASS:-}
      WIREGUARD_PRIVATE_KEY: ${GLUETUN_WIREGUARD_PRIVATE_KEY:-}
      SERVER_COUNTRIES: ${GLUETUN_SERVER_COUNTRIES:-Austria}
      UPDATER_PERIOD: 480h
      # qBittorrent/libtorrent can remain stalled after Gluetun internally
      # rebuilds the VPN tunnel. Signal the recovery watcher on every VPN-up.
      VPN_UP_COMMAND: /bin/sh -c "date +%s > /gluetun/vpn-up.timestamp"
    volumes:
      - /share/Config/gluetun:/gluetun
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-18080}:${QBITTORRENT_WEBUI_PORT:-18080}"
    labels:
      # Keep the tightly-coupled VPN namespace pair out of automatic recreation.
      # WUD still watches and notifies about updates.
      wud.trigger.exclude: docker.auto
      io.github.zndavid.vpn-stack-revision: *vpn-stack-revision
    logging: *default-logging

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-18080}
      TORRENTING_PORT: ${QBITTORRENT_TORRENTING_PORT:-6881}
    volumes:
      - /share/Config/qbittorrent:/config
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT after storage migration}/torrents
        target: /data/torrents
        bind:
          create_host_path: false
    labels:
      wud.trigger.exclude: docker.auto
      io.github.zndavid.vpn-stack-revision: *vpn-stack-revision
    stop_grace_period: 30s
    logging: *default-logging

  # Gluetun auto-heals its VPN internally. qBittorrent 5.x/libtorrent can keep
  # stale peer connections after that event, so restart only qBittorrent once
  # the rebuilt tunnel is healthy. This helper has no network access.
  qbittorrent-recovery:
    image: docker:27-cli
    container_name: qbittorrent-recovery
    restart: unless-stopped
    network_mode: none
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    environment:
      GLUETUN_CONTAINER: gluetun
      QBITTORRENT_CONTAINER: qbittorrent
      VPN_UP_MARKER_FILE: /gluetun/vpn-up.timestamp
      POLL_INTERVAL: 5
      RECOVERY_DELAY: 10
      HEALTH_WAIT_TIMEOUT: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /share/Config/gluetun:/gluetun:ro
    # Inline shell avoids a repository-relative bind mount in Portainer CE.
    # Escape shell dollars as $$ so Compose leaves them for /bin/sh.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu

        MARKER_FILE="$${VPN_UP_MARKER_FILE:-/gluetun/vpn-up.timestamp}"
        GLUETUN_CONTAINER="$${GLUETUN_CONTAINER:-gluetun}"
        QBITTORRENT_CONTAINER="$${QBITTORRENT_CONTAINER:-qbittorrent}"
        POLL_INTERVAL="$${POLL_INTERVAL:-5}"
        RECOVERY_DELAY="$${RECOVERY_DELAY:-10}"
        HEALTH_WAIT_TIMEOUT="$${HEALTH_WAIT_TIMEOUT:-120}"

        log() {
          printf '%s %s\n' "$$(date -Iseconds 2>/dev/null || date)" "$$*"
        }

        read_marker() {
          if [ -r "$$MARKER_FILE" ]; then
            cat "$$MARKER_FILE" 2>/dev/null || true
          fi
        }

        gluetun_health() {
          docker inspect \
            --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
            "$$GLUETUN_CONTAINER" 2>/dev/null || true
        }

        qbittorrent_running() {
          [ "$$(docker inspect --format '{{.State.Running}}' "$$QBITTORRENT_CONTAINER" 2>/dev/null || true)" = "true" ]
        }

        last_marker=""
        log "Waiting for initial Gluetun VPN-up marker at $${MARKER_FILE}"

        while [ -z "$$last_marker" ]; do
          last_marker="$$(read_marker)"
          if [ -z "$$last_marker" ]; then
            sleep "$$POLL_INTERVAL"
          fi
        done

        log "Recovery watcher armed; initial marker=$${last_marker}"

        while :; do
          current_marker="$$(read_marker)"

          if [ -n "$$current_marker" ] && [ "$$current_marker" != "$$last_marker" ]; then
            last_marker="$$current_marker"
            log "Detected Gluetun VPN reconnect; waiting $${RECOVERY_DELAY}s before qBittorrent recovery"
            sleep "$$RECOVERY_DELAY"

            waited=0
            while [ "$$(gluetun_health)" != "healthy" ] && [ "$$waited" -lt "$$HEALTH_WAIT_TIMEOUT" ]; do
              sleep "$$POLL_INTERVAL"
              waited=$$((waited + POLL_INTERVAL))
            done

            if [ "$$(gluetun_health)" != "healthy" ]; then
              log "Gluetun did not become healthy within $${HEALTH_WAIT_TIMEOUT}s; qBittorrent restart skipped"
              continue
            fi

            if qbittorrent_running; then
              log "Restarting qBittorrent after VPN recovery"
              if docker restart -t 30 "$$QBITTORRENT_CONTAINER" >/dev/null; then
                log "qBittorrent restarted successfully"
              else
                log "qBittorrent restart failed"
              fi
            else
              log "qBittorrent is not running; leaving it stopped"
            fi
          fi

          sleep "$$POLL_INTERVAL"
        done
    logging: *default-logging

  sonarr:
    <<: *service-defaults
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *common-env
    volumes:
      - /share/Config/sonarr:/config
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT after storage migration}
        target: /data
        bind:
          create_host_path: false
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  radarr:
    <<: *service-defaults
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *common-env
    volumes:
      - /share/Config/radarr:/config
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT after storage migration}
        target: /data
        bind:
          create_host_path: false
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  prowlarr:
    <<: *service-defaults
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *common-env
    volumes:
      - /share/Config/prowlarr:/config
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  bazarr:
    <<: *service-defaults
    image: ghcr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: *common-env
    volumes:
      - /share/Config/bazarr:/config
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT after storage migration}/media
        target: /data/media
        bind:
          create_host_path: false
    ports:
      - "6767:6767"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  jellyfin:
    <<: *service-defaults
    image: ghcr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment: *common-env
    volumes:
      - /share/Config/jellyfin:/config
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT after storage migration}/media
        target: /data/media
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  seerr:
    <<: *service-defaults
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      TZ: ${TZ}
    volumes:
      - /share/Config/seerr:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  cloudflared:
    <<: *service-defaults
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    read_only: true
    logging: *default-logging

  # Weekly image checks, Telegram notifications and automatic updates for
  # eligible containers. The VPN namespace pair and WUD itself stay Git-managed.
  # Startup/event scans remain disabled.
  wud:
    image: getwud/wud:9.2.1
    container_name: wud
    restart: unless-stopped
    networks:
      - media-net
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "true"
      WUD_WATCHER_LOCAL_WATCHDIGESTDEFAULT: "true"
      WUD_WATCHER_LOCAL_CRON: "0 12 * * 0"
      WUD_WATCHER_LOCAL_JITTER: 60000
      WUD_WATCHER_LOCAL_WATCHATSTART: "false"
      WUD_WATCHER_LOCAL_WATCHEVENTS: "false"
      WUD_AUTH_ADMIN_USER: ${WUD_ADMIN_USER:-admin}
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_ADMIN_PASSWORD:?Set a private WUD_ADMIN_PASSWORD in Portainer}
      WUD_TRIGGER_DOCKER_AUTO_AUTO: "true"
      WUD_TRIGGER_DOCKER_AUTO_INCLUDEBYDEFAULT: "true"
      WUD_TRIGGER_DOCKER_AUTO_PRUNE: "false"
      WUD_TRIGGER_TELEGRAM_UPDATES_AUTO: "true"
      WUD_TRIGGER_TELEGRAM_UPDATES_BOTTOKEN: ${TELEGRAM_BOT_TOKEN}
      WUD_TRIGGER_TELEGRAM_UPDATES_CHATID: ${TELEGRAM_CHAT_ID}
    volumes:
      - /share/Config/wud:/store
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${WUD_WEBUI_PORT:-13000}:3000"
    labels:
      # WUD itself is upgraded deliberately through Git/Portainer.
      wud.watch: "false"
    logging: *default-logging

networks:
  media-net:
    driver: bridge
