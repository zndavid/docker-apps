name: media-stack

x-common-env: &common-env
  TZ: ${TZ}
  PUID: ${PUID}
  PGID: ${PGID}

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - media-net
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # Primary torrent VPN. qBittorrent shares this network namespace, so it has
  # no independent network path that could bypass the VPN tunnel.
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    networks:
      - media-net
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: ${GLUETUN_VPN_TYPE:-wireguard}
      OPENVPN_USER: ${NORDVPN_USER:-}
      OPENVPN_PASSWORD: ${NORDVPN_PASS:-}
      WIREGUARD_PRIVATE_KEY: ${GLUETUN_WIREGUARD_PRIVATE_KEY:-}
      SERVER_COUNTRIES: ${GLUETUN_SERVER_COUNTRIES:-Austria}
      UPDATER_PERIOD: 480h
    volumes:
      - /share/Config/gluetun:/gluetun
    ports:
      - "${QBITTORRENT_WEBUI_PORT:-18080}:${QBITTORRENT_WEBUI_PORT:-18080}"
    labels:
      # Keep the tightly-coupled VPN namespace pair out of automatic recreation.
      # WUD still watches and notifies about updates.
      wud.trigger.exclude: docker.weekly
    logging: *default-logging

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT:-18080}
      TORRENTING_PORT: ${QBITTORRENT_TORRENTING_PORT:-6881}
    volumes:
      - /share/Config/qbittorrent:/config
      - /share/Downloads:/downloads
    labels:
      wud.trigger.exclude: docker.weekly
    stop_grace_period: 30s
    logging: *default-logging

  sonarr:
    <<: *service-defaults
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *common-env
    depends_on:
      prowlarr:
        condition: service_healthy
    volumes:
      - /share/Config/sonarr:/config
      - /share/Media/Series:/tv
      - /share/Downloads:/downloads
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  radarr:
    <<: *service-defaults
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *common-env
    depends_on:
      prowlarr:
        condition: service_healthy
    volumes:
      - /share/Config/radarr:/config
      - /share/Media/Movies:/movies
      - /share/Downloads:/downloads
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  prowlarr:
    <<: *service-defaults
    image: ghcr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *common-env
    volumes:
      - /share/Config/prowlarr:/config
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  lazylibrarian:
    <<: *service-defaults
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: lazylibrarian
    environment: *common-env
    depends_on:
      prowlarr:
        condition: service_healthy
    volumes:
      - /share/Config/lazylibrarian:/config
      - /share/Downloads:/downloads
      - /share/Media/Books:/books
    ports:
      - "5299:5299"
    logging: *default-logging

  bazarr:
    <<: *service-defaults
    image: ghcr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment: *common-env
    depends_on:
      sonarr:
        condition: service_healthy
      radarr:
        condition: service_healthy
    volumes:
      - /share/Config/bazarr:/config
      - /share/Media/Movies:/movies
      - /share/Media/Series:/tv
    ports:
      - "6767:6767"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  jellyfin:
    <<: *service-defaults
    image: ghcr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment: *common-env
    volumes:
      - /share/Config/jellyfin:/config
      - /share/Media/Series:/data/tvshows:ro
      - /share/Media/Movies:/data/movies:ro
    ports:
      - "8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  seerr:
    <<: *service-defaults
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      TZ: ${TZ}
    depends_on:
      jellyfin:
        condition: service_healthy
    volumes:
      - /share/Config/seerr:/app/config
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  cloudflared:
    <<: *service-defaults
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    read_only: true
    logging: *default-logging

  # Weekly automatic updater. Remote image checks only run Sunday around noon.
  # Startup/event-triggered scans are disabled so updates cannot happen at night
  # just because the NAS or WUD container restarted.
  wud:
    image: getwud/wud:8.3.0
    container_name: wud
    restart: unless-stopped
    networks:
      - media-net
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      WUD_WATCHER_LOCAL_SOCKET: /var/run/docker.sock
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: "true"
      WUD_WATCHER_LOCAL_CRON: "0 12 * * 0"
      WUD_WATCHER_LOCAL_JITTER: 60000
      WUD_WATCHER_LOCAL_WATCHATSTART: "false"
      WUD_WATCHER_LOCAL_WATCHEVENTS: "false"
      WUD_TRIGGER_DOCKER_WEEKLY_AUTO: "true"
      WUD_TRIGGER_DOCKER_WEEKLY_PRUNE: "true"
      WUD_TRIGGER_TELEGRAM_UPDATES_AUTO: "true"
      WUD_TRIGGER_TELEGRAM_UPDATES_BOTTOKEN: ${TELEGRAM_BOT_TOKEN}
      WUD_TRIGGER_TELEGRAM_UPDATES_CHATID: ${TELEGRAM_CHAT_ID}
    volumes:
      - /share/Config/wud:/store
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${WUD_WEBUI_PORT:-13000}:3000"
    labels:
      # WUD updates the rest of the stack but is upgraded deliberately.
      wud.watch: "false"
    logging: *default-logging

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: ${TZ}
    volumes:
      - /share/Config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  media-net:
    driver: bridge
