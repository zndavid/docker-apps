# Temporary migration aliases into the NEW storage tree, not the old shares.
# Remove from Portainer Additional paths after updating all application paths.
services:
  qbittorrent:
    volumes:
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/torrents
        target: /downloads
        bind:
          create_host_path: false
  radarr:
    volumes:
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/torrents
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/media/movies
        target: /movies
        bind:
          create_host_path: false
  sonarr:
    volumes:
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/torrents
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/media/tv
        target: /tv
        bind:
          create_host_path: false
  bazarr:
    volumes:
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/media/movies
        target: /movies
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/media/tv
        target: /tv
        bind:
          create_host_path: false
  jellyfin:
    volumes:
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/media/movies
        target: /data/movies
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MEDIA_STACK_DATA_ROOT:?Set MEDIA_STACK_DATA_ROOT}/media/tv
        target: /data/tvshows
        read_only: true
        bind:
          create_host_path: false
